[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-utd"
version = "0.1.0"
description = "Reproducible, rights-aware academic journal metadata pipeline"
requires-python = ">=3.10"
dependencies = ["defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
