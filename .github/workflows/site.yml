name: Sync metadata and deploy Pages

on:
  push:
    branches: [main]
  discussion_comment:
    types: [created, edited, deleted]
  discussion:
    types: [edited, deleted, transferred, category_changed]
  workflow_dispatch:
    inputs:
      comments_only:
        description: Refresh comments only (skip unchanged; reuse the built site)
        required: true
        type: boolean
        default: false
      sync_metadata:
        description: Fetch and persist Crossref metadata before deployment
        required: true
        type: boolean
        default: false
      initial_import:
        description: Historical import (requires sync_metadata)
        required: true
        type: boolean
        default: false
      from_year:
        description: Initial import year (blank uses each journal's registry start_year)
        required: false
        type: string
        default: '2006'
      journal:
        description: Journal slug to synchronize (blank selects all journals)
        required: false
        type: string
        default: ''
  schedule:
    # Monday 02:23 UTC = Monday 10:23 Asia/Shanghai. GitHub may delay scheduled runs.
    - cron: '23 2 * * 1'
    # Daily fallback at 11:37 Asia/Shanghai; comment events handle normal updates.
    - cron: '37 3 * * *'

permissions: {}

# Never interrupt a snapshot update or deploy an older run over a newer one.
concurrency:
  group: open-utd-production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # Only the validated sync snapshot step writes to main.
      pages: write # configure-pages reads repository Pages configuration.
      discussions: read # Server-side collection only; never exposed to the browser.
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    env:
      AJR_ENV: production
      AJR_DB_PATH: data/journals.sqlite
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
      PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      INPUT_SYNC_METADATA: ${{ inputs.sync_metadata || false }}
      INPUT_INITIAL_IMPORT: ${{ inputs.initial_import || false }}
      INPUT_FROM_YEAR: ${{ inputs.from_year }}
      INPUT_JOURNAL: ${{ inputs.journal }}
      COMMENT_EVENT: ${{ github.event_name == 'discussion_comment' || github.event_name == 'discussion' }}
      COMMENTS_ONLY: ${{ github.event_name == 'discussion_comment' || github.event_name == 'discussion' || (github.event_name == 'schedule' && github.event.schedule == '37 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.comments_only == true) }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Resolve site URL and base path
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          site="${PUBLIC_SITE_URL:-https://${owner}.github.io}"
          base="${PUBLIC_BASE_PATH:-/${repo}}"
          if [[ "${repo,,}" == "${owner,,}.github.io" && -z "$PUBLIC_BASE_PATH" ]]; then
            base='/'
          fi
          echo "PUBLIC_SITE_URL=$site" >> "$GITHUB_ENV"
          echo "PUBLIC_BASE_PATH=$base" >> "$GITHUB_ENV"

      - name: Guard manual import options
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMMENTS_ONLY" == true && ( "$INPUT_SYNC_METADATA" == true || "$INPUT_INITIAL_IMPORT" == true ) ]]; then
            echo 'comments_only cannot be combined with metadata synchronization' >&2
            exit 1
          fi
          if [[ "$INPUT_INITIAL_IMPORT" == true && "$INPUT_SYNC_METADATA" != true ]]; then
            echo 'initial_import requires sync_metadata=true' >&2
            exit 1
          fi
          if [[ "$INPUT_INITIAL_IMPORT" == true && -n "$INPUT_FROM_YEAR" ]] && ! [[ "$INPUT_FROM_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo 'from_year must be blank or a four-digit year' >&2
            exit 1
          fi
          if [[ -n "$INPUT_JOURNAL" ]] && ! [[ "$INPUT_JOURNAL" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo 'journal must be blank or one registered lowercase journal slug' >&2
            exit 1
          fi

      - name: Collect comments without installing build dependencies
        if: env.COMMENTS_ONLY == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_comments.py

      - name: Compare with the published comment content
        id: changes
        if: env.COMMENTS_ONLY == 'true'
        run: python -m scripts.comment_refresh compare

      - name: Identify the exact source and configuration cache
        id: restore_key
        if: env.COMMENTS_ONLY == 'true' && (steps.changes.outputs.changed == 'true' || env.COMMENT_EVENT != 'true')
        run: python -m scripts.comment_refresh cache-key >> "$GITHUB_OUTPUT"

      - name: Restore verified HTML and search index
        id: site_cache
        if: env.COMMENTS_ONLY == 'true' && (steps.changes.outputs.changed == 'true' || env.COMMENT_EVENT != 'true')
        continue-on-error: true # Cache service failures also take the full-build fallback.
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .artifacts/site-shell.tar
          key: ${{ steps.restore_key.outputs.key }}
          # Daily/manual no-change checks inspect availability without downloading.
          lookup-only: ${{ steps.changes.outputs.changed != 'true' }}

      - name: Decide whether to publish or rebuild
        id: plan
        env:
          COMMENTS_CHANGED: ${{ steps.changes.outputs.changed }}
          CACHE_HIT: ${{ steps.site_cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          publish=true
          full_build=true
          if [[ "$COMMENTS_ONLY" == true ]]; then
            if [[ "$COMMENTS_CHANGED" != true ]]; then
              if [[ "$COMMENT_EVENT" != true && "$CACHE_HIT" != true ]]; then
                echo 'Comment content unchanged, but the site cache is missing; rebuilding it in this trusted scheduled/manual run.' >> "$GITHUB_STEP_SUMMARY"
              else
                publish=false
                full_build=false
              fi
            elif [[ "$CACHE_HIT" == true ]]; then
              full_build=false
            else
              echo 'Verified site cache unavailable; falling back to a full build.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "full_build=$full_build" >> "$GITHUB_OUTPUT"
          if [[ "$publish" == false ]]; then
            echo 'No changes; skipped dependencies, cache download, build and deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.plan.outputs.full_build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        if: steps.plan.outputs.full_build == 'true'
        run: |
          python -m pip install -e '.[dev]'
          npm ci

      - name: Synchronize metadata in a fixed Crossref index window
        if: (github.event_name == 'schedule' && github.event.schedule == '23 2 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.sync_metadata == true)
        env:
          # The contact credential is available only to the network sync step.
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROSSREF_MAILTO:-}" ]]; then
            echo 'Missing Actions secret CROSSREF_MAILTO' >&2
            exit 1
          fi
          python scripts/cli.py db-init
          python scripts/cli.py seed --file data/journal_registry.csv
          sync_args=(--provider crossref)
          if [[ -n "$INPUT_JOURNAL" ]]; then
            sync_args+=(--journal "$INPUT_JOURNAL")
          fi
          if [[ "$INPUT_INITIAL_IMPORT" == true ]]; then
            sync_args+=(--mode initial)
            if [[ -n "$INPUT_FROM_YEAR" ]]; then
              sync_args+=(--from-year "$INPUT_FROM_YEAR")
            fi
          else
            sync_args+=(--mode incremental)
          fi
          python scripts/cli.py sync "${sync_args[@]}"
          python scripts/cli.py report --out data/sync-report.md

      # Keep a recoverable import even if a later build or capacity guard fails.
      - name: Archive synchronized metadata snapshot
        if: (github.event_name == 'schedule' && github.event.schedule == '23 2 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.sync_metadata == true)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/journals.sqlite
            data/sync-report.md
          retention-days: 7
          if-no-files-found: error

      - name: Validate production data and test code
        if: steps.plan.outputs.full_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$AJR_DB_PATH" || { echo 'Run the manual initial import first: production snapshot missing.' >&2; exit 1; }
          python scripts/cli.py validate --production
          python -m pytest -q
          npm run check

      - name: Fetch complete public comment snapshot
        if: steps.plan.outputs.full_build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_comments.py

      - name: Build HTML and Pagefind, verify links, record resource limits
        if: steps.plan.outputs.full_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          npm run build
          elapsed=$((SECONDS - started))
          npm run test:site
          python scripts/build_metrics.py --db "$AJR_DB_PATH" --dist dist --build-seconds "$elapsed"

      - name: Replace only the comment JSON in the verified site
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.full_build == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xf .artifacts/site-shell.tar -C dist
          python -m scripts.comment_refresh patch
          echo 'Reused verified HTML and Pagefind. Updated only data/comments.json; no npm install, Astro build, indexing or full-site link scan.' >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN pushes do not trigger a second deployment workflow. This job
      # must finish successfully before the dependent deploy job publishes its artifact.
      - name: Commit validated metadata snapshot
        if: (github.event_name == 'schedule' && github.event.schedule == '23 2 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.sync_metadata == true)
        shell: bash
        run: |
          set -euo pipefail
          test ! -s data/journals.sqlite-wal
          test ! -s data/journals.sqlite-journal
          git add -- data/journals.sqlite data/sync-report.md
          if git diff --cached --quiet; then
            echo 'No metadata snapshot changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: update academic journal metadata'
            # Never force-push: another main update or branch protection fails safely.
            git push origin HEAD:main
          fi

      - name: Record the built source and configuration
        if: steps.plan.outputs.full_build == 'true'
        run: python -m scripts.comment_refresh record-build

      - name: Configure GitHub Pages
        if: steps.plan.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload verified Pages artifact
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 1

      # Keep comments out of the reusable cache. A fresh complete feed is required
      # before each publication; cached deleted comments can never be restored.
      - name: Prepare verified site cache after any metadata commit
        id: save_key
        if: steps.plan.outputs.full_build == 'true' && env.COMMENT_EVENT != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          tar --exclude='./data/comments.json' -cf .artifacts/site-shell.tar -C dist .
          python -m scripts.comment_refresh cache-key >> "$GITHUB_OUTPUT"

      - name: Save verified HTML and search index for comment refreshes
        # GitHub permits default-branch cache writes on push/schedule/manual runs,
        # while discussion events remain restore-only under the default policy.
        if: steps.plan.outputs.full_build == 'true' && env.COMMENT_EVENT != 'true'
        continue-on-error: true # A cache outage must not block an otherwise valid deployment.
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .artifacts/site-shell.tar
          key: ${{ steps.save_key.outputs.key }}

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact from this run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
